apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders-api}
  template:
    metadata:
      labels: {app: orders-api}
    spec:
      containers:
      - name: web
        image: nginx:1.27-alpine
        resources:
          requests: {cpu: 10m, memory: 16Mi}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-api
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: orders-api}
