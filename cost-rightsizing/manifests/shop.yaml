# Three services sized "by template": every container asks for 1 CPU and 1Gi.
# Each one actually does a little work in a loop (see the command).
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: shop}
spec:
  replicas: 3
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: app
        image: python:3.13-alpine
        command: ["python3", "-c", "import time\nb = bytearray(40*1024*1024)\nwhile True:\n    sum(i*i for i in range(30000)); time.sleep(0.2)"]
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: worker, namespace: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: worker}}
  template:
    metadata: {labels: {app: worker}}
    spec:
      containers:
      - name: app
        image: python:3.13-alpine
        command: ["python3", "-c", "import time\nb = bytearray(120*1024*1024)\nwhile True:\n    sum(i*i for i in range(200000)); time.sleep(0.2)"]
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {memory: 1Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: reports, namespace: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: reports}}
  template:
    metadata: {labels: {app: reports}}
    spec:
      containers:
      - name: app
        image: python:3.13-alpine
        command: ["python3", "-c", "import time\nb = bytearray(20*1024*1024)\nwhile True:\n    sum(i*i for i in range(5000)); time.sleep(1)"]
        resources:
          requests: {cpu: "1", memory: 1Gi}
          limits: {memory: 1Gi}
