kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: cost-lab
networking:
  # nftables mode: the iptables mode needs the xt_statistic kernel module,
  # which the test machine's kernel did not have (see README).
  kubeProxyMode: nftables
nodes:
  - role: control-plane
    image: kindest/node:v1.37.0
